services:
  - type: web
    name: dirtywater-app
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/migrate_parquet_to_db.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dirtywater-db
          property: connectionString
      - key: ODDS_API_KEY
        sync: false
      - key: TEAM_ID
        value: "111"
      - key: TEAM_ABBR
        value: "BOS"
      - key: SEASON
        value: "2026"
      - key: PYTHON_VERSION
        value: "3.11.8"

databases:
  - name: dirtywater-db
    databaseName: dirtywater
    user: dirtywater_user
    plan: starter
