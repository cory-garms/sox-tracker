services:
  - type: web
    name: dirtywater-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/migrate_parquet_to_db.py
    startCommand: sh -c 'uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-10000}'
    healthCheckPath: /healthz

    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ODDS_API_KEY
        sync: false
      # Shared secret for POST /api/v1/refresh. Leave unset to keep the
      # refresh webhook disabled; it is never open when the token is absent.
      - key: REFRESH_TOKEN
        sync: false
      - key: TEAM_ID
        value: "111"
      - key: TEAM_ABBR
        value: "BOS"
      - key: SEASON
        value: "2026"
      - key: PYTHON_VERSION
        value: "3.11.8"


