name: Daily Data Refresh

on:
  # Offseason: scheduled runs paused. Manual runs remain available.
  workflow_dispatch:       # allow manual trigger from the GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to commit updated cache files

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest data
        run: python fetch.py --team ${{ vars.TEAM_ABBR || 'BOS' }} --season ${{ vars.SEASON || '2026' }} --refresh
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"

      # Every page is data-driven, so refreshing only the dashboard left the
      # matchup / leaders / streak / betting pages showing stale figures.
      - name: Build all pages
        env:
          TEAM: ${{ vars.TEAM_ABBR || 'BOS' }}
          SEASON: ${{ vars.SEASON || '2026' }}
          # Set this repo secret to pull live sportsbook lines:
          #   Settings -> Secrets and variables -> Actions -> New repository secret
          # Without it the betting page builds with projections only and states
          # that no lines were connected — it never invents one.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python viz_report.py     --team "$TEAM" --season "$SEASON"
          python leaders_report.py --team "$TEAM" --season "$SEASON"
          python matchup_report.py --team "$TEAM" --season "$SEASON"
          python betting_report.py --team "$TEAM" --season "$SEASON"
          python streak_report.py
          # Every figure in a post is computed from the caches, so the notebook
          # rebuilds with them or its numbers drift from the pages they came from.
          python blog_report.py --team "$TEAM" --season "$SEASON"

      - name: Commit updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          # The odds history is the one file here that cannot be rebuilt: every
          # other artefact is derived from data that still exists, but a line
          # price nobody wrote down at 12:00 ET is gone for good. It has to be
          # committed or the runner throws away the snapshot it just took.
          git add data/cache/odds_history.parquet || true
          # Same argument, same file pattern, and it was missing: betting_report.py
          # logs every projection it just made beside the line it was quoted
          # against, and without this line the runner wrote that log and then
          # threw it away. Only 22 live predictions survived a month of builds,
          # and those solely because an unrelated manual commit swept the file
          # in. The post-game run grades what is already committed and skips
          # betting_report.py to save odds credits, so a projection not written
          # down here is never gradeable at all.
          git add data/cache/predictions_history.parquet || true
          git diff --cached --quiet || git commit -m "chore: auto-refresh data $(date -u +%Y-%m-%d)"
          git push
